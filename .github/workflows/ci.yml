name: CI

# Roda em todo push de branch que não seja a main e em todo PR para a main.
# Se build ou teste falhar, o check fica vermelho e o PR não pode ser mesclado
# (exige a regra de proteção da branch main, configurada em Settings > Branches).
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-e-testes:
    # Matriz ubuntu + windows (RNF13)
    name: Build e testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar pacotes
        run: dotnet restore CorredorVerde.slnx

      - name: Compilar
        run: dotnet build CorredorVerde.slnx --configuration Release --no-restore

      # Cobertura de código (RNF11)
      - name: Testar com cobertura
        run: >
          dotnet test CorredorVerde.slnx --configuration Release --no-build
          --collect:"XPlat Code Coverage" --results-directory ./resultados
          --logger "trx;LogFileName=testes.trx"

      # Cobertura mínima (RNF11): se a cobertura cair abaixo destes valores, o check fica vermelho e o PR não pode ser mesclado.
      # Para mudar o limite, é só trocar os números abaixo.
      - name: Conferir cobertura mínima
        shell: pwsh
        env:
          MINIMO_LINHAS: 90
          MINIMO_RAMOS: 85
        run: |
          $arquivo = Get-ChildItem -Path ./resultados -Recurse -Filter coverage.cobertura.xml | Select-Object -First 1
          if (-not $arquivo) { throw "Relatório de cobertura não encontrado em ./resultados." }

          [xml]$xml = Get-Content -Path $arquivo.FullName
          $linhas = [double]$xml.coverage.'line-rate' * 100
          $ramos = [double]$xml.coverage.'branch-rate' * 100
          $minLinhas = [double]$env:MINIMO_LINHAS
          $minRamos = [double]$env:MINIMO_RAMOS

          $resumo = "Cobertura de linhas: {0:N1}% (mínimo {1}%). Cobertura de ramos: {2:N1}% (mínimo {3}%)." -f $linhas, $minLinhas, $ramos, $minRamos
          Write-Host $resumo
          if ($env:GITHUB_STEP_SUMMARY) { Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $resumo }

          if ($linhas -lt $minLinhas -or $ramos -lt $minRamos) {
            Write-Host "::error::Cobertura abaixo do mínimo. $resumo"
            exit 1
          }

      - name: Guardar resultados dos testes e cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-${{ matrix.os }}
          path: resultados/**
          if-no-files-found: ignore
